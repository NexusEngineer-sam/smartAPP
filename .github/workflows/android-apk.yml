name: Build NEXUS Android APK

on:
  push:
    branches:
      - feature/native-android-alarm
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPACITOR_SERVER_URL: https://smartapp-d4va.onrender.com
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Add exact alarm permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permission = '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if permission not in manifest:
              manifest = manifest.replace("<manifest", "<manifest", 1)
              marker = ">"
              start = manifest.find("<manifest")
              end = manifest.find(marker, start)
              manifest = manifest[:end + 1] + "\\n    " + permission + manifest[end + 1:]
              path.write_text(manifest)
          PY

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload NEXUS APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Campus OS quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_os?schema=public\n          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/campus_os?schema=public
      - name: Type-check
        run: npm run lint
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_os?schema=public\n          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/campus_os?schema=public
      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_os?schema=public\n          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/campus_os?schema=public
          CRON_SECRET: ci-only-placeholder-secret
